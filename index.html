<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANFMAA | Abeda Noor Fazil Madrasah Alumni Association</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Hind Siliguri', sans-serif; background: #fafafa; color: #09090b; scroll-behavior: smooth; }
    .mono-card { background: #ffffff; border: 1px solid #e4e4e7; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.06); transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    .mono-card:hover { transform: translateY(-4px); border-color: #09090b; box-shadow: 0 20px 32px -10px rgba(0, 0, 0, 0.16); }
    .bw-avatar { filter: grayscale(100%); transition: filter 0.3s ease; }
    .mono-card:hover .bw-avatar { filter: grayscale(0%); }
  </style>
</head>
<body class="antialiased selection:bg-black selection:text-white">
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-zinc-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-black text-white flex items-center justify-center font-bold text-sm tracking-tighter shadow">AN</div>
        <div>
          <div class="font-bold text-base leading-none tracking-tight">ANFMAA</div>
          <div class="text-[11px] text-zinc-500 mt-0.5">আবেদা-নূর ফাযিল মাদ্রাসা অ্যালামনাই</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="bg-zinc-950 hover:bg-zinc-800 text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-lg shadow-md hover:shadow-xl transition">
          + Join Alumni Database
        </button>
      </div>
    </div>
  </header>
  <section class="py-14 sm:py-20 px-4 border-b border-zinc-200 bg-gradient-to-b from-white via-zinc-50 to-zinc-100/80">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-3xl sm:text-5xl font-bold tracking-tight text-zinc-950 mb-3">
        Abeda Noor Fazil Madrasah Alumni Association
      </h1>
      <p class="text-base sm:text-lg text-zinc-600 font-medium mb-2">
        আবেদা-নূর ফাযিল মাদ্রাসা অ্যালামনাই অ্যাসোসিয়েশন (ANFMAA)
      </p>
    </div>
  </section>
</body>
</html>
